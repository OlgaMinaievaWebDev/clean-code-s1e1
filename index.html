<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <img src="./eisenhower-matrix.jpg" alt="Diagram of Eisenhower Matrix" class="header__img">
    <a 
      class="header__link"
      href="https://goal-life.com/page/method/matrix-eisenhower"
     >
      Want more details?
    </a>
  </header>

  <main class="main">

    <section id="add-task-section">
      <h3 class="section_heading">Add Item</h3>
      <div class="task__wrapper" >
        <label for="new-task" class="visually-hidden">Add Item</label>
        <input
          id="new-task"
          class="task__input"
          aria-label="New task"
          type="text"
          name="task_text"
        >
        <button type="submit">Add</button>
      </div>
    </section>

    <section id="todo-list-section">
      <h3 class="section_heading">Todo</h3>
      <ul class="task__list" id="incompleteTasks">
        <li class="task__item">
          <input type="checkbox" class="task__checkbox" id="task-item">
          <label for="task-item" class="task__label">Pay Bills</label>
          <input type="text" >
          <button class="edit" type="button">Edit</button>
          <button class="delete" type="button">
            <img src="./remove.svg" alt="delete icon" class="delete-icon">
          </button>
        </li>
        <li class="task__edit">
        <input type="checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="goShopping" class="task">
        <button class="edit" type="button">Save</button>
        <button class="delete" type="button">
          <img src="./remove.svg" alt="delete icon" class="delete-icon">
        </button>
        </li>
      </ul>
    </section>

    <section id="todo-tasks-completed">
      <h3 class="section_heading">Completed</h3>
      <ul id="completed-tasks">
       <li>
         <input type="checkbox" checked>
         <label class="task">See the Doctor</label>
         <input type="text" class="task">
         <button class="edit" type="button">Edit</button>
         <button class="delete" type="button">
           <img src="./remove.svg" alt="delete icon" class="delete-icon">
         </button>
       </li>
      </ul>
     </section>

  </main>
  
  <script src="app.js"></script>

</body>
</html>
