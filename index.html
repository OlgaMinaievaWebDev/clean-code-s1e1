<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <img src="./eisenhower-matrix.jpg" alt="Diagram of Eisenhower Matrix">
    <a 
      class="header__link"
      href="https://goal-life.com/page/method/matrix-eisenhower"
     >
      Want more details?
    </a>
  </header>
  <main class="main">

    <section id="add-task-section">
      <h3 class="section_heading">Add Item</h3>
      <div class="task__wrapper" >
        <label for="new-task" class="visually-hidden">Add Item</label>
        <input
          id="new-task"
          class="task__input"
          aria-label="New task"
          type="text"
          name="task_text"
        >
        <button>Add</button>
      </div>
     </section>
     
     <section id="todo-list-section">
     <h3 class="section_heading">Todo</h3>
  <ul id="incompleteTasks">
    <li>
       <input type="checkbox">
       <label class="task">Pay Bills</label>
       <input type="text" class="task">
       <button class="edit">Edit</button>
       <button class="delete">
         <img src="./remove.svg" alt="">
       </button>
     </li>
     <li class="editMode">
        <input type="checkbox">
        <label class="task">Go Shopping</label>
        <input type="text" value="Go Shopping" class="task">
        <button class="edit">Save</button>
        <button class="delete">
          <img src="./remove.svg" alt="delete icon">
        </button>
     </li>
   </ul>
   </section>


<h3 class="section_heading">Completed</h3>
<ul id="completed-tasks">
 <li>
  <input type="checkbox" checked>
  <label class="task">See the Doctor</label>
  <input type="text" class="task">
  <button class="edit">Edit</button>
  <button class="delete">
   <img src="./remove.svg" alt="delete icon">
  </button>
</li>
</ul>
</main>
<script src="app.js"></script>
</body>
</html>
